services:
  postgres:
    image: postgres:16
    container_name: dolenae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dolenae
      POSTGRES_PASSWORD: dolenae
      POSTGRES_DB: dolenae
    ports:
      - "5432:5432"
    volumes:
      - dolenae-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolenae -d dolenae"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dolenae-pgdata:
