services:
  postgres:
    image: postgres:16
    container_name: dolenae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dolenae
      POSTGRES_PASSWORD: dolenae
      POSTGRES_DB: dolenae
    ports:
      # POSTGRES_PORT lets a local machine avoid a 5432 conflict (dev only).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dolenae-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolenae -d dolenae"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for destination images.
  minio:
    image: minio/minio:latest
    container_name: dolenae-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - dolenae-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dolenae-pgdata:
  dolenae-miniodata:
