name: dolenae_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.2
  shared_preferences: ^2.5.6
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  # Font diambil dari aset lokal, bukan dari jaringan saat runtime.
  # `google_fonts` mencari berkas yang namanya diakhiri `Inter-<Bobot>.ttf`
  # atau `Poppins-<Bobot>.ttf`, jadi nama berkas di sini tidak boleh diubah.
  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
